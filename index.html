<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل پیام</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6">
    <div class="max-w-md mx-auto space-y-4">
        <input id="user" placeholder="نام کاربری" class="w-full p-2 bg-gray-900 border rounded">
        <input id="pass" type="password" placeholder="رمز عبور" class="w-full p-2 bg-gray-900 border rounded">
        <textarea id="msg" placeholder="متن پیام..." class="w-full p-2 bg-gray-900 border rounded"></textarea>
        
        <div class="flex gap-2">
            <button onclick="req('send')" class="flex-1 bg-green-700 p-2 rounded">ارسال</button>
            <button onclick="req('inbox')" class="flex-1 bg-blue-700 p-2 rounded">مشاهده</button>
        </div>
        <div id="out" class="space-y-2 mt-4"></div>
    </div>

    <script>
        const API = 'https://main-db.abtin-sad1393.workers.dev'; 
        
        async function req(type) {
            const endpoint = type === 'send' ? '/api/send' : '/api/inbox';
            const body = {
                username: document.getElementById('user').value,
                password: document.getElementById('pass').value,
                message: document.getElementById('msg').value
            };
            
            try {
                const res = await fetch(API + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                
                if(data.error) {
                    alert(data.error);
                } else if(data.messages) {
                    document.getElementById('out').innerHTML = data.messages.map(m => 
                        `<div class="bg-gray-800 p-3 rounded text-sm">${m.text} <br> <span class="text-xs text-gray-400">${m.date}</span></div>`
                    ).join('');
                } else {
                    alert('پیام با موفقیت ارسال شد');
                }
            } catch (err) {
                alert('خطا در ارتباط با سرور: ' + err.message);
            }
        }
    </script>
</body>
</html>
