<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صندوق پیام آبتین</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-6">
    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-xl font-bold text-center">مدیریت پیام‌ها</h1>
        
        <div class="space-y-3">
            <input id="in-user" placeholder="نام کاربری" class="w-full p-3 bg-gray-800 rounded border border-gray-700">
            <input id="in-pass" type="password" placeholder="رمز عبور" class="w-full p-3 bg-gray-800 rounded border border-gray-700">
            <textarea id="in-msg" placeholder="پیام شما..." class="w-full p-3 bg-gray-800 rounded border border-gray-700 h-24"></textarea>
            
            <div class="flex gap-2">
                <button onclick="doAction('send')" class="flex-1 bg-green-600 p-3 rounded font-bold hover:bg-green-700">ارسال پیام</button>
                <button onclick="doAction('inbox')" class="flex-1 bg-blue-600 p-3 rounded font-bold hover:bg-blue-700">مشاهده صندوق</button>
            </div>
        </div>

        <div id="out-box" class="space-y-3 pt-4 border-t border-gray-800"></div>
    </div>

    <script>
        const API_URL = 'https://main-db.abtin-sad1393.workers.dev';

        async function doAction(type) {
            const user = document.getElementById('in-user').value;
            const pass = document.getElementById('in-pass').value;
            const msg = document.getElementById('in-msg').value;

            const endpoint = type === 'send' ? '/api/send' : '/api/inbox';
            
            try {
                const res = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass, message: msg })
                });

                const data = await res.json();
                
                if(data.error) {
                    alert('خطا: ' + data.error);
                } else if(type === 'inbox') {
                    const box = document.getElementById('out-box');
                    box.innerHTML = data.messages.map(m => `
                        <div class="bg-gray-900 p-4 rounded border-r-4 border-blue-500 shadow">
                            <p class="text-sm">${m.text}</p>
                            <span class="text-[10px] text-gray-500 block mt-2">${m.date}</span>
                        </div>
                    `).join('');
                } else {
                    alert('پیام با موفقیت ذخیره شد!');
                }
            } catch (err) {
                alert('ارتباط با سرور برقرار نشد.');
            }
        }
    </script>
</body>
</html>
